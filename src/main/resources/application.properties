spring.application.name=honse-analysis
spring.datasource.url=jdbc:postgresql://localhost:5432/ScoreAnalysisDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=fill
spring.datasource.password=fill
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
message-from-application-properties="This is default profile"
spring.profiles.active=dev